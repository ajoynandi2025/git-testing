---
- name: Patch RHEL 7, 8, 9 and 10 systems
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Display target system
      ansible.builtin.debug:
        msg: "Patching {{ ansible_hostname }} - {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Update all packages on RHEL 7
      ansible.builtin.yum:
        name: "*"
        state: latest
        update_only: true
      when:
        - ansible_distribution == "RedHat"
        - ansible_distribution_major_version == "7"

    - name: Update all packages on RHEL 8, 9 and 10
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true
      when:
        - ansible_distribution == "RedHat"
        - ansible_distribution_major_version in ["8", "9", "10"]